name: CodeQL
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "41 3 * * 3"}]
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (python)
    # Runs only while the repository is public (code scanning / Scorecard need a public repo or paid features); it switches on by itself later.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.27.5
        with: {languages: python, queries: security-extended}
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.27.5
        with: {category: "/language:python"}
