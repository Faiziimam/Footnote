name: security
on:
  push: {branches: [main]}
  pull_request:
  schedule: [{cron: "17 4 * * 1"}]        # weekly, in case a new rule flags old code
permissions:
  contents: read
jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - name: Static security scan (bandit; dev tool only, not a runtime dependency)
        run: |
          python -m pip install --disable-pip-version-check "bandit==1.9.4"
          bandit -r footnote -q --severity-level low
      - name: Attack tests (web page, relay, hostile input, secrets, supply chain)
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
          python -m unittest tests.test_security -v
  dependency-review:
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}   # needs the dependency graph (public repos)
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with: {fail-on-severity: moderate}
