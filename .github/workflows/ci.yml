name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}      # macOS/Windows are new; failures there are reported but don't block yet
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - {os: macos-latest, python: "3.12", experimental: true}
          - {os: windows-latest, python: "3.12", experimental: true}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "${{ matrix.python }}"}
      - name: Git identity for tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
      - name: Run the tests (no dependencies to install)
        run: python -m unittest discover -s tests -t .
  installer:
    name: single-file installer is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - run: |
          python build_pyz.py /tmp/a && python build_pyz.py /tmp/b
          cmp /tmp/a/footnote.pyz /tmp/b/footnote.pyz
          python /tmp/a/footnote.pyz --help > /dev/null
