name: Scorecard
on:
  branch_protection_rule:
  schedule: [{cron: "23 5 * * 2"}]
  push: {branches: [main]}
permissions: read-all
jobs:
  analysis:
    # Runs only while the repository is public (code scanning / Scorecard need a public repo or paid features); it switches on by itself later.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions: {security-events: write, id-token: write, contents: read, actions: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with: {results_file: results.sarif, results_format: sarif, publish_results: true}
      - uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88  # v3.27.5
        with: {sarif_file: results.sarif}
