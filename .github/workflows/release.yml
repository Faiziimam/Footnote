name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: {python-version: "3.12"}
      - name: Test before releasing
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
          python -m unittest discover -s tests -t .
      - name: Build twice and require identical bytes (reproducible)
        run: |
          python build_pyz.py dist
          python build_pyz.py /tmp/second
          cmp dist/footnote.pyz /tmp/second/footnote.pyz
          (cd dist && sha256sum -c footnote.pyz.sha256)
      - name: Build the npm package (same footnote.pyz; publishing to npm is a separate, manual step)
        run: |
          python scripts/build_npm.py dist/npm
          (cd dist/npm && npm pack --pack-destination ../..)
      # Signed provenance needs a public repository (or GitHub Enterprise); it switches on by itself once the repo is public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/footnote.pyz
            dist/footnote-app-*.tgz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}          # passed as an environment variable, never pasted into the script
        run: gh release create "$TAG" dist/footnote.pyz dist/footnote.pyz.sha256 dist/footnote-app-*.tgz --generate-notes --title "$TAG"
