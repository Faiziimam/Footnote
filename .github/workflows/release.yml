name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: {python-version: "3.12"}
      - name: Test before releasing
        run: |
          git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
          python -m unittest discover -s tests -t .
      - name: Build twice and require identical bytes (reproducible)
        run: |
          python build_pyz.py dist
          python build_pyz.py /tmp/second
          cmp dist/footnote.pyz /tmp/second/footnote.pyz
          (cd dist && sha256sum -c footnote.pyz.sha256)
      # Signed provenance needs a public repository (or GitHub Enterprise); it switches on by itself once the repo is public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb  # v2.1.0
        with: {subject-path: dist/footnote.pyz}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}          # passed as an environment variable, never pasted into the script
        run: gh release create "$TAG" dist/footnote.pyz dist/footnote.pyz.sha256 --generate-notes --title "$TAG"
