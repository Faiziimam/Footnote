<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Footnote</title>
<style nonce="__NONCE__">
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e3e3de;--accent:#3b5bdb;--ok:#2f9e44;--warn:#e8590c}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#212120;--ink:#ecece8;--mute:#9a9a94;--line:#33332f;--accent:#7c93ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}.bar{flex:1;min-width:160px;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}main{padding:16px 20px;max-width:1200px;margin:auto}
.say{display:flex;gap:8px;margin:0 0 6px}input,select,button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.say input{flex:1}button{cursor:pointer}button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
#msg{min-height:22px;color:var(--mute);margin-bottom:10px;white-space:pre-line}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.col{background:color-mix(in srgb,var(--card) 60%,transparent);border:1px solid var(--line);border-radius:12px;padding:10px}
.col h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:2px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.card b{display:block}.meta{color:var(--mute);font-size:12.5px;margin-top:3px}.wait{color:var(--warn)}
.card select{margin-top:8px;width:100%;padding:5px 8px;font-size:13px}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mute)}
code{background:var(--line);padding:1px 5px;border-radius:4px}
.sr{position:absolute;left:-9999px}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.wide{width:100%}
.out{white-space:pre-wrap;font:13px/1.5 ui-monospace,monospace;margin:0}.ro{background:var(--line);padding:6px 20px;font-size:13px}
</style></head><body>
<div class="ro" id="ro" hidden>View only: changes are turned off in this window.</div><header><h1>Footnote</h1><div class="bar"><i id="pb"></i></div><span id="pct"></span>
<button id="sync">Refresh</button></header>
<main>
<form class="say" id="sayf"><label class="sr" for="say">Tell me what happened</label><input id="say" placeholder="Tell me what happened — “I finished the logo and started the landing page”" autofocus>
<button class="p">Update</button></form>
<div id="msg" role="status" aria-live="polite"></div>
<form class="say" id="addf"><label class="sr" for="add">New task</label><input id="add" placeholder="Add a new task…"><button>Add</button></form>
<div class="cols" id="cols"></div>
<details id="rep"><summary>Project report, team &amp; catch-up</summary>
<p><select id="aud"><option value="all">Everything</option><option value="manager">For founders &amp; managers</option>
<option value="everyone">For everyone (plain)</option><option value="developer">For developers</option></select>
<button id="rbtn">Show report</button> <button id="cbtn">What changed since I last looked?</button> <button id="dbtn">Download slides (.pptx)</button></p>
<pre id="rout" class="out" aria-live="polite"></pre></details>
<details id="connect"><summary>Connect another tracker (Notion, Google Sheets, Excel…)</summary>
<label>Which one?</label><select id="ctype"></select><div id="cfields"></div>
<p><button class="p" id="cgo">Connect</button></p><div id="cmsg" class="meta"></div></details>
</main>
<script nonce="__NONCE__">
const RO=__READONLY__,T="__TOKEN__",H={"X-Tracker-Token":T,"Content-Type":"application/json"};
const api=async(p,b)=>{const r=await fetch("/api/"+p,b?{method:"POST",headers:H,body:JSON.stringify(b)}:{headers:H});
 const j=await r.json();if(!r.ok)throw new Error(j.error||"Something went wrong");return j};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=["Not started","In progress","Blocked","Done"];
async function load(){const {tasks,summary}=await api("tasks");
 $("#pb").style.width=summary.percent_done+"%";$("#pct").textContent=summary.percent_done+"% done · "+summary.total+" tasks";
 $("#cols").innerHTML=L.map(l=>`<div class="col"><h2>${l}</h2>`+tasks.filter(t=>t.status_label==l).map(t=>
  `<div class="card"><b>${esc(t.title)}</b><div class="meta">${esc(t.id)} · ${esc(t.epic)}${t.owner?" · 👤 "+esc(t.owner):""}</div>`+
  (t.waiting_on.length?`<div class="meta wait">Waiting on ${esc(t.waiting_on.join(", "))}</div>`:"")+
  (t.children.length?`<div class="meta">${t.children.length} subtasks</div>`:"")+
  `<select data-id="${esc(t.id)}" aria-label="Status of ${esc(t.title)}"${RO?" disabled":""}>${L.map(x=>`<option${x==l?" selected":""}>${esc(x)}</option>`).join("")}</select></div>`).join("")+`</div>`).join("");
 document.querySelectorAll(".card select").forEach(s=>s.onchange=async()=>{try{await api("status",{id:s.dataset.id,status:s.value});}catch(e){$("#msg").textContent=e.message}load()})}
const run=async f=>{try{await f()}catch(e){$("#msg").textContent="⚠ "+e.message}};
$("#sayf").onsubmit=e=>{e.preventDefault();run(async()=>{const r=await api("say",{text:$("#say").value});
 $("#msg").textContent=r.results.map(x=>(x.ok?"✓ ":"? ")+x.message).join("\n");$("#say").value="";load()})};
$("#addf").onsubmit=e=>{e.preventDefault();run(async()=>{await api("tasks",{title:$("#add").value});$("#add").value="";$("#msg").textContent="✓ Added";load()})};
$("#sync").onclick=()=>run(async()=>{const r=await api("sync",{});$("#msg").textContent=r.warnings.length?"⚠ "+r.warnings.join("\n"):"✓ Up to date";load()});
$("#rbtn").onclick=()=>run(async()=>{$("#rout").textContent=(await api("report?for="+$("#aud").value)).markdown});
$("#cbtn").onclick=()=>run(async()=>{$("#rout").textContent=(await api("catchup")).markdown});
$("#dbtn").onclick=()=>run(async()=>{const r=await fetch("/api/deck?for="+$("#aud").value,{headers:H});if(!r.ok)throw new Error("Could not make the slides");
 const u=URL.createObjectURL(await r.blob());const a=document.createElement("a");a.href=u;a.download="project-review.pptx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)});
let M;async function conn(){M=await api("mirrors");$("#ctype").innerHTML=Object.entries(M.types).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join("");fields()}
function fields(){$("#cfields").innerHTML=(M.fields[$("#ctype").value]||[]).map(([k,t,req])=>`<label>${esc(t)}${req?" *":""}</label><input data-k="${esc(k)}" class="wide">`).join("")}
$("#ctype").onchange=fields;
$("#cgo").onclick=()=>run(async()=>{const b={type:$("#ctype").value};document.querySelectorAll("#cfields input").forEach(i=>b[i.dataset.k]=i.value);
 $("#cmsg").textContent="Connecting…";const r=await api("connect",b);$("#cmsg").textContent=r.warnings.length?"⚠ "+r.warnings.join("\n"):"✓ Connected: "+r.mirrors.map(m=>m[1]).join(", ");load()});
if(RO){$("#ro").hidden=false;document.querySelectorAll("form button,form input,#connect").forEach(e=>e.disabled=true);$("#connect").hidden=true}
run(load);conn();setInterval(()=>run(load),15000);
</script></body></html>
